
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: var(--font-sans); }
.app { max-width: 420px; margin: 0 auto; padding: 1rem; }
.header { text-align: center; padding: 1.5rem 0 1rem; }
.header h1 { font-size: 18px; font-weight: 500; color: var(--color-text-primary); }
.header p { font-size: 13px; color: var(--color-text-secondary); margin-top: 4px; }
.status-bar { display: flex; align-items: center; justify-content: space-between; background: var(--color-background-secondary); border-radius: var(--border-radius-md); padding: 10px 14px; margin-bottom: 1rem; font-size: 13px; }
.status-dot { width: 8px; height: 8px; border-radius: 50%; background: #888; margin-right: 8px; display: inline-block; }
.status-dot.recording { background: #E24B4A; animation: pulse 1s infinite; }
.status-dot.ready { background: #639922; }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }
.transcript-box { background: var(--color-background-primary); border: 0.5px solid var(--color-border-tertiary); border-radius: var(--border-radius-lg); padding: 1rem; min-height: 160px; max-height: 200px; overflow-y: auto; margin-bottom: 1rem; font-size: 14px; line-height: 1.7; color: var(--color-text-primary); }
.transcript-box .placeholder { color: var(--color-text-tertiary); font-size: 13px; }
.interim { color: var(--color-text-secondary); font-style: italic; }
.controls { display: flex; gap: 10px; margin-bottom: 1rem; }
.btn-record { flex: 2; padding: 12px; border-radius: var(--border-radius-md); font-size: 14px; font-weight: 500; cursor: pointer; border: none; transition: all 0.2s; }
.btn-record.start { background: #E24B4A; color: #fff; }
.btn-record.stop { background: var(--color-background-secondary); color: var(--color-text-primary); border: 0.5px solid var(--color-border-secondary); }
.btn-secondary { flex: 1; padding: 12px; border-radius: var(--border-radius-md); font-size: 13px; cursor: pointer; border: 0.5px solid var(--color-border-secondary); background: var(--color-background-secondary); color: var(--color-text-secondary); }
.btn-generate { width: 100%; padding: 13px; border-radius: var(--border-radius-md); font-size: 14px; font-weight: 500; cursor: pointer; border: 0.5px solid var(--color-border-primary); background: var(--color-background-primary); color: var(--color-text-primary); margin-bottom: 1rem; display: none; }
.btn-generate:hover { background: var(--color-background-secondary); }
.minutes-box { background: var(--color-background-primary); border: 0.5px solid var(--color-border-tertiary); border-radius: var(--border-radius-lg); padding: 1.25rem; margin-bottom: 1rem; display: none; }
.minutes-box h2 { font-size: 15px; font-weight: 500; margin-bottom: 1rem; color: var(--color-text-primary); border-bottom: 0.5px solid var(--color-border-tertiary); padding-bottom: 8px; }
.minutes-content { font-size: 13px; line-height: 1.8; color: var(--color-text-primary); white-space: pre-wrap; }
.loading-indicator { text-align: center; color: var(--color-text-secondary); font-size: 13px; padding: 1rem; display: none; }
.loading-dots { display: inline-block; }
.loading-dots::after { content: ''; animation: dots 1.5s infinite; }
@keyframes dots { 0%{content:'.'} 33%{content:'..'} 66%{content:'...'} 100%{content:'.'} }
.info-banner { background: var(--color-background-secondary); border-radius: var(--border-radius-md); padding: 10px 14px; font-size: 12px; color: var(--color-text-secondary); margin-bottom: 1rem; line-height: 1.6; }
.meta-row { display: flex; gap: 8px; margin-bottom: 10px; }
.meta-chip { background: var(--color-background-secondary); border: 0.5px solid var(--color-border-tertiary); border-radius: var(--border-radius-md); padding: 6px 12px; font-size: 12px; color: var(--color-text-secondary); flex: 1; text-align: center; }
.meta-chip span { display: block; font-size: 14px; font-weight: 500; color: var(--color-text-primary); margin-top: 2px; }
.timer { font-variant-numeric: tabular-nums; }
.error-msg { background: var(--color-background-danger); border-radius: var(--border-radius-md); padding: 10px 14px; font-size: 13px; color: var(--color-text-danger); margin-bottom: 1rem; display: none; }
.copy-btn { float: right; font-size: 12px; color: var(--color-text-secondary); cursor: pointer; border: none; background: none; padding: 0; }
.copy-btn:hover { color: var(--color-text-primary); }
</style>

<div class="app">
  <h2 class="sr-only">실시간 녹취 및 자동 회의록 작성 앱</h2>

  <div class="header">
    <h1>회의록 자동 작성</h1>
    <p>실시간 음성 인식 → AI 회의록 생성</p>
  </div>

  <div class="info-banner" id="browser-info">
    Chrome(Android) 또는 Edge에서 최적으로 동작합니다. 마이크 권한을 허용해 주세요.
  </div>

  <div class="status-bar">
    <div style="display:flex;align-items:center;">
      <span class="status-dot ready" id="status-dot"></span>
      <span id="status-text" style="color:var(--color-text-secondary);">대기 중</span>
    </div>
    <span class="timer" id="timer" style="font-size:13px;color:var(--color-text-secondary);">00:00</span>
  </div>

  <div class="meta-row">
    <div class="meta-chip">날짜<span id="meta-date">-</span></div>
    <div class="meta-chip">단어 수<span id="meta-words">0</span></div>
    <div class="meta-chip">상태<span id="meta-status">준비</span></div>
  </div>

  <div class="transcript-box" id="transcript-box">
    <span class="placeholder" id="placeholder">녹음 시작 버튼을 누르면 음성이 텍스트로 변환됩니다...</span>
  </div>

  <div class="error-msg" id="error-msg"></div>

  <div class="controls">
    <button class="btn-record start" id="record-btn" onclick="toggleRecording()">녹음 시작</button>
    <button class="btn-secondary" onclick="clearAll()">초기화</button>
  </div>

  <button class="btn-generate" id="generate-btn" onclick="generateMinutes()">AI 회의록 생성 →</button>

  <div class="loading-indicator" id="loading">
    AI가 회의록을 작성하고 있습니다<span class="loading-dots"></span>
  </div>

  <div class="minutes-box" id="minutes-box">
    <h2>회의록 <button class="copy-btn" onclick="copyMinutes()">복사</button></h2>
    <div class="minutes-content" id="minutes-content"></div>
  </div>
</div>

<script>
let recognition = null;
let isRecording = false;
let finalTranscript = '';
let timerInterval = null;
let seconds = 0;
let startTime = null;

function initDate() {
  const now = new Date();
  const d = `${now.getFullYear()}.${String(now.getMonth()+1).padStart(2,'0')}.${String(now.getDate()).padStart(2,'0')}`;
  document.getElementById('meta-date').textContent = d;
}
initDate();

function showError(msg) {
  const el = document.getElementById('error-msg');
  el.textContent = msg;
  el.style.display = 'block';
  setTimeout(() => el.style.display = 'none', 5000);
}

function updateTimer() {
  seconds++;
  const m = String(Math.floor(seconds/60)).padStart(2,'0');
  const s = String(seconds%60).padStart(2,'0');
  document.getElementById('timer').textContent = `${m}:${s}`;
}

function updateWordCount() {
  const words = finalTranscript.trim().split(/\s+/).filter(w => w.length > 0).length;
  document.getElementById('meta-words').textContent = words;
}

function toggleRecording() {
  if (!isRecording) startRecording();
  else stopRecording();
}

function startRecording() {
  if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
    showError('이 브라우저는 음성 인식을 지원하지 않습니다. Chrome(Android)를 사용해 주세요.');
    return;
  }
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  recognition = new SR();
  recognition.lang = 'ko-KR';
  recognition.continuous = true;
  recognition.interimResults = true;
  recognition.maxAlternatives = 1;

  recognition.onstart = () => {
    isRecording = true;
    document.getElementById('status-dot').className = 'status-dot recording';
    document.getElementById('status-text').textContent = '녹음 중';
    document.getElementById('meta-status').textContent = '녹음 중';
    document.getElementById('record-btn').textContent = '녹음 중지';
    document.getElementById('record-btn').className = 'btn-record stop';
    document.getElementById('placeholder').style.display = 'none';
    document.getElementById('generate-btn').style.display = 'none';
    document.getElementById('minutes-box').style.display = 'none';
    document.getElementById('browser-info').style.display = 'none';
    seconds = 0;
    timerInterval = setInterval(updateTimer, 1000);
  };

  recognition.onresult = (event) => {
    let interim = '';
    for (let i = event.resultIndex; i < event.results.length; i++) {
      const text = event.results[i][0].transcript;
      if (event.results[i].isFinal) {
        finalTranscript += text + ' ';
        updateWordCount();
      } else {
        interim += text;
      }
    }
    const box = document.getElementById('transcript-box');
    box.innerHTML = `<span>${finalTranscript}</span><span class="interim">${interim}</span>`;
    box.scrollTop = box.scrollHeight;
  };

  recognition.onerror = (event) => {
    if (event.error === 'not-allowed') showError('마이크 접근이 거부되었습니다. 브라우저 설정에서 마이크 권한을 허용해 주세요.');
    else if (event.error === 'network') showError('네트워크 오류가 발생했습니다.');
    else if (event.error !== 'no-speech') showError(`음성 인식 오류: ${event.error}`);
  };

  recognition.onend = () => {
    if (isRecording) recognition.start();
  };

  recognition.start();
}

function stopRecording() {
  isRecording = false;
  if (recognition) { recognition.onend = null; recognition.stop(); }
  clearInterval(timerInterval);
  document.getElementById('status-dot').className = 'status-dot ready';
  document.getElementById('status-text').textContent = '녹음 완료';
  document.getElementById('meta-status').textContent = '완료';
  document.getElementById('record-btn').textContent = '녹음 시작';
  document.getElementById('record-btn').className = 'btn-record start';
  if (finalTranscript.trim().length > 10) {
    document.getElementById('generate-btn').style.display = 'block';
  }
}

function clearAll() {
  if (isRecording) stopRecording();
  finalTranscript = '';
  seconds = 0;
  document.getElementById('transcript-box').innerHTML = '<span class="placeholder" id="placeholder">녹음 시작 버튼을 누르면 음성이 텍스트로 변환됩니다...</span>';
  document.getElementById('timer').textContent = '00:00';
  document.getElementById('meta-words').textContent = '0';
  document.getElementById('meta-status').textContent = '준비';
  document.getElementById('status-dot').className = 'status-dot ready';
  document.getElementById('status-text').textContent = '대기 중';
  document.getElementById('generate-btn').style.display = 'none';
  document.getElementById('minutes-box').style.display = 'none';
  document.getElementById('loading').style.display = 'none';
  document.getElementById('browser-info').style.display = 'block';
}

async function generateMinutes() {
  if (!finalTranscript.trim()) { showError('녹취 내용이 없습니다.'); return; }
  document.getElementById('loading').style.display = 'block';
  document.getElementById('generate-btn').style.display = 'none';
  document.getElementById('minutes-box').style.display = 'none';

  const today = new Date();
  const dateStr = `${today.getFullYear()}년 ${today.getMonth()+1}월 ${today.getDate()}일`;
  const duration = document.getElementById('timer').textContent;

  const prompt = `다음은 ${dateStr} 진행된 회의의 실시간 녹취록입니다 (녹음 시간: ${duration}).

[녹취 내용]
${finalTranscript}

위 녹취 내용을 바탕으로 아래 형식에 맞춰 전문적인 회의록을 작성해 주세요:

■ 회의 개요
- 일시: ${dateStr}
- 녹음 시간: ${duration}

■ 주요 논의 사항
(발언된 핵심 주제와 내용을 항목별로 정리)

■ 결정 사항
(회의에서 결정된 사항들)

■ 액션 아이템
(후속 조치가 필요한 항목들, 담당자 및 기한이 언급된 경우 포함)

■ 기타 사항
(참고할 내용이 있으면 포함, 없으면 생략)

녹취 내용이 부족하거나 불명확한 경우에도 최대한 파악 가능한 내용으로 회의록을 작성해 주세요.`;

  try {
    const response = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: 'claude-sonnet-4-20250514',
        max_tokens: 1000,
        messages: [{ role: 'user', content: prompt }]
      })
    });
    const data = await response.json();
    const text = data.content?.map(b => b.text || '').join('') || '회의록 생성에 실패했습니다.';
    document.getElementById('minutes-content').textContent = text;
    document.getElementById('minutes-box').style.display = 'block';
  } catch (err) {
    showError('AI 연결에 실패했습니다. 잠시 후 다시 시도해 주세요.');
    document.getElementById('generate-btn').style.display = 'block';
  } finally {
    document.getElementById('loading').style.display = 'none';
  }
}

function copyMinutes() {
  const text = document.getElementById('minutes-content').textContent;
  navigator.clipboard.writeText(text).then(() => {
    const btn = document.querySelector('.copy-btn');
    btn.textContent = '복사됨!';
    setTimeout(() => btn.textContent = '복사', 2000);
  });
}
</script>
