<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>회의록 자동 작성</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #f5f5f5;
    color: #111;
    min-height: 100vh;
    padding: 0 0 40px;
  }
  .header {
    background: #fff;
    border-bottom: 1px solid #e5e5e5;
    padding: 16px 20px 14px;
    position: sticky;
    top: 0;
    z-index: 10;
  }
  .header h1 { font-size: 17px; font-weight: 600; }
  .header p { font-size: 12px; color: #888; margin-top: 2px; }
  .section { background: #fff; margin: 12px 16px 0; border-radius: 12px; padding: 16px; }
  .section-title { font-size: 12px; font-weight: 600; color: #888; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 10px; }
  .status-row { display: flex; align-items: center; justify-content: space-between; }
  .status-left { display: flex; align-items: center; gap: 8px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #34c759; flex-shrink: 0; }
  .dot.recording { background: #ff3b30; animation: pulse 1s infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }
  .status-text { font-size: 14px; color: #555; }
  .timer { font-size: 14px; font-variant-numeric: tabular-nums; color: #555; font-weight: 500; }
  .stats { display: flex; gap: 8px; margin-top: 12px; }
  .stat { flex: 1; background: #f5f5f5; border-radius: 8px; padding: 10px; text-align: center; }
  .stat-label { font-size: 11px; color: #888; }
  .stat-value { font-size: 15px; font-weight: 600; margin-top: 2px; }
  .transcript {
    min-height: 120px; max-height: 200px; overflow-y: auto;
    font-size: 15px; line-height: 1.7; color: #111;
    -webkit-overflow-scrolling: touch;
  }
  .transcript .ph { color: #aaa; font-size: 14px; }
  .transcript .interim { color: #999; font-style: italic; }
  .field { margin-bottom: 12px; }
  .field label { font-size: 12px; color: #888; display: block; margin-bottom: 5px; }
  .field input {
    width: 100%; padding: 11px 13px; border: 1px solid #e0e0e0;
    border-radius: 8px; font-size: 15px; color: #111;
    background: #fafafa; -webkit-appearance: none;
  }
  .field input:focus { outline: none; border-color: #007aff; background: #fff; }
  .tags { display: flex; flex-wrap: wrap; gap: 7px; }
  .tag {
    padding: 6px 13px; border-radius: 999px; font-size: 13px; cursor: pointer;
    border: 1px solid #ddd; background: #f5f5f5; color: #555;
    -webkit-user-select: none; user-select: none; transition: 0.15s;
  }
  .tag.sel { background: #007aff; color: #fff; border-color: transparent; }
  .btn-rec {
    width: 100%; padding: 15px; border-radius: 12px; border: none;
    font-size: 16px; font-weight: 600; cursor: pointer; transition: 0.15s; -webkit-appearance: none;
  }
  .btn-rec.start { background: #ff3b30; color: #fff; }
  .btn-rec.stop { background: #e9e9e9; color: #111; }
  .btn-rec:active { opacity: 0.8; transform: scale(0.98); }
  .btn-row { display: flex; gap: 10px; }
  .btn-action {
    flex: 1; padding: 13px; border-radius: 10px; border: none;
    font-size: 14px; font-weight: 600; cursor: pointer; -webkit-appearance: none; transition: 0.15s;
  }
  .btn-action:active { opacity: 0.7; }
  .btn-reset { background: #e9e9e9; color: #555; }
  .btn-ai { background: #007aff; color: #fff; }
  .btn-notion { background: #000; color: #fff; }
  .btn-disabled { opacity: 0.4; pointer-events: none; }
  .result-card { background: #f0f7ff; border-radius: 10px; padding: 14px; margin-top: 10px; }
  .result-card .rc-body { font-size: 14px; line-height: 1.7; color: #111; white-space: pre-wrap; }
  .notion-card { background: #f0fff4; border-radius: 10px; padding: 14px; margin-top: 10px; }
  .notion-card .nc-title { font-size: 12px; font-weight: 600; color: #34c759; margin-bottom: 5px; }
  .notion-card a { font-size: 14px; color: #007aff; text-decoration: none; font-weight: 500; }
  .loading-bar {
    background: #fff; margin: 12px 16px 0; border-radius: 12px;
    padding: 18px 16px; text-align: center; display: none;
  }
  .loading-bar p { font-size: 14px; color: #555; }
  .spinner {
    width: 28px; height: 28px; border: 2px solid #e0e0e0; border-top-color: #007aff;
    border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 10px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .err-bar {
    background: #fff0f0; margin: 12px 16px 0; border-radius: 12px;
    padding: 13px 16px; font-size: 14px; color: #ff3b30; display: none;
  }
  .db-banner {
    background: #fff; margin: 12px 16px 0; border-radius: 12px;
    padding: 12px 16px; display: flex; align-items: center; gap: 10px;
  }
  .db-badge { width: 8px; height: 8px; border-radius: 50%; background: #34c759; flex-shrink: 0; }
  .db-text { font-size: 13px; color: #555; flex: 1; }
  .db-text strong { color: #111; }
  .db-link { font-size: 13px; color: #007aff; text-decoration: none; white-space: nowrap; }
  .steps { display: flex; align-items: center; justify-content: center; padding: 14px 0 4px; }
  .step { display: flex; align-items: center; gap: 5px; font-size: 12px; color: #ccc; }
  .step.active { color: #111; font-weight: 600; }
  .step.done { color: #34c759; }
  .step-n {
    width: 20px; height: 20px; border-radius: 50%; border: 1px solid #ddd;
    display: flex; align-items: center; justify-content: center; font-size: 11px;
  }
  .step.active .step-n { background: #007aff; color: #fff; border-color: transparent; }
  .step.done .step-n { background: #34c759; color: #fff; border-color: transparent; font-size: 10px; }
  .step-line { width: 24px; height: 1px; background: #e0e0e0; margin: 0 4px; }
</style>
</head>
<body>

<div class="header">
  <h1>회의록 자동 작성</h1>
  <p>음성 녹취 → AI 회의록 → 노션 저장</p>
</div>

<div class="steps">
  <div class="step active" id="step1"><span class="step-n">1</span>녹취</div>
  <div class="step-line"></div>
  <div class="step" id="step2"><span class="step-n">2</span>AI 생성</div>
  <div class="step-line"></div>
  <div class="step" id="step3"><span class="step-n">3</span>노션 저장</div>
</div>

<div class="db-banner">
  <span class="db-badge"></span>
  <span class="db-text">노션 연동 · <strong>회의록 보관함</strong>에 저장</span>
  <a class="db-link" href="https://www.notion.so/1fa9e920a595418180f9a5a61a11ad7c" target="_blank">DB 열기 →</a>
</div>

<div class="section">
  <div class="status-row">
    <div class="status-left">
      <span class="dot" id="sdot"></span>
      <span class="status-text" id="stxt">대기 중</span>
    </div>
    <span class="timer" id="timer">00:00</span>
  </div>
  <div class="stats">
    <div class="stat"><div class="stat-label">일시</div><div class="stat-value" id="mdate" style="font-size:13px;">-</div></div>
    <div class="stat"><div class="stat-label">녹음</div><div class="stat-value" id="mdur">0:00</div></div>
    <div class="stat"><div class="stat-label">단어</div><div class="stat-value" id="mwords">0</div></div>
  </div>
</div>

<div class="section">
  <div class="section-title">실시간 녹취</div>
  <div class="transcript" id="tarea">
    <span class="ph">녹음을 시작하면 여기에 실시간으로 텍스트가 표시됩니다.</span>
  </div>
</div>

<div style="padding: 12px 16px 0;">
  <button class="btn-rec start" id="recbtn" onclick="toggleRec()">녹음 시작</button>
  <div class="btn-row" style="margin-top:10px;">
    <button class="btn-action btn-reset" onclick="clearAll()">초기화</button>
    <button class="btn-action btn-ai btn-disabled" id="aibtn" onclick="genMinutes()">AI 회의록 생성</button>
  </div>
</div>

<div class="section" id="meta-form" style="display:none;">
  <div class="section-title">회의 정보</div>
  <div class="field">
    <label>회의 제목</label>
    <input type="text" id="inp-title" placeholder="예: 주간 설계팀 회의">
  </div>
  <div class="field">
    <label>참석자</label>
    <input type="text" id="inp-attendees" placeholder="홍길동, 김철수">
  </div>
  <div class="field" style="margin-bottom:0">
    <label>태그</label>
    <div class="tags">
      <span class="tag" onclick="toggleTag(this)">건축</span>
      <span class="tag" onclick="toggleTag(this)">설계</span>
      <span class="tag" onclick="toggleTag(this)">시공</span>
      <span class="tag" onclick="toggleTag(this)">인허가</span>
      <span class="tag" onclick="toggleTag(this)">내부</span>
      <span class="tag" onclick="toggleTag(this)">클라이언트</span>
    </div>
  </div>
</div>

<div class="loading-bar" id="loading">
  <div class="spinner"></div>
  <p id="ldtxt">처리 중...</p>
</div>

<div class="err-bar" id="err"></div>

<div id="minutes-wrap" style="display:none;">
  <div class="section">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;">
      <div class="section-title" style="margin:0">생성된 회의록</div>
      <button onclick="copyMin()" style="font-size:13px;color:#007aff;border:none;background:none;cursor:pointer;padding:0;">복사</button>
    </div>
    <div class="result-card">
      <div class="rc-body" id="mcontent"></div>
    </div>
  </div>
  <div style="padding: 12px 16px 0;">
    <button class="btn-action btn-notion" id="notionbtn" onclick="saveToNotion()" style="width:100%;padding:15px;font-size:16px;border-radius:12px;">노션에 저장 →</button>
  </div>
</div>

<div class="section" id="notion-wrap" style="display:none;">
  <div class="notion-card">
    <div class="nc-title">저장 완료</div>
    <div id="notion-result"></div>
  </div>
</div>

<div style="height:40px;"></div>

<script>
const DS_ID = '404c6964-7efd-4063-86ee-564b77ca7922';
let recognition=null, isRec=false, finalTxt='', secs=0, timerInt=null;
let generatedMinutes='', parsedData={};

function initDate() {
  const n=new Date();
  document.getElementById('mdate').textContent=`${n.getMonth()+1}/${n.getDate()}`;
}
initDate();

function showErr(msg) {
  const e=document.getElementById('err');
  e.textContent=msg; e.style.display='block';
  setTimeout(()=>e.style.display='none', 5000);
}

function setStep(n) {
  ['step1','step2','step3'].forEach((id,i)=>{
    const el=document.getElementById(id);
    el.className='step'+(i+1<n?' done':i+1===n?' active':'');
    el.querySelector('.step-n').textContent=i+1<n?'✓':String(i+1);
  });
}

function toggleTag(el){ el.classList.toggle('sel'); }
function getSelectedTags(){ return Array.from(document.querySelectorAll('.tag.sel')).map(t=>t.textContent); }
function updTimer(){ secs++; const m=String(Math.floor(secs/60)).padStart(2,'0'),s=String(secs%60).padStart(2,'0'); document.getElementById('timer').textContent=`${m}:${s}`; document.getElementById('mdur').textContent=`${m}:${s}`; }
function updWords(){ document.getElementById('mwords').textContent=finalTxt.trim().split(/\s+/).filter(x=>x).length; }

function toggleRec(){ isRec?stopRec():startRec(); }

function startRec() {
  if(!('webkitSpeechRecognition' in window)&&!('SpeechRecognition' in window)){
    showErr('Chrome 브라우저에서 열어주세요.'); return;
  }
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  recognition=new SR();
  recognition.lang='ko-KR'; recognition.continuous=true; recognition.interimResults=true;
  recognition.onstart=()=>{
    isRec=true;
    document.getElementById('sdot').className='dot recording';
    document.getElementById('stxt').textContent='녹음 중...';
    document.getElementById('recbtn').textContent='녹음 중지';
    document.getElementById('recbtn').className='btn-rec stop';
    document.getElementById('aibtn').classList.add('btn-disabled');
    document.getElementById('meta-form').style.display='none';
    document.getElementById('minutes-wrap').style.display='none';
    document.getElementById('notion-wrap').style.display='none';
    secs=0; timerInt=setInterval(updTimer,1000); setStep(1);
  };
  recognition.onresult=(e)=>{
    let interim='';
    for(let i=e.resultIndex;i<e.results.length;i++){
      const t=e.results[i][0].transcript;
      if(e.results[i].isFinal){finalTxt+=t+' ';updWords();}else interim+=t;
    }
    const b=document.getElementById('tarea');
    b.innerHTML=`<span>${finalTxt}</span><span class="interim">${interim}</span>`;
    b.scrollTop=b.scrollHeight;
  };
  recognition.onerror=(e)=>{
    if(e.error==='not-allowed')showErr('마이크 권한을 허용해 주세요.');
    else if(e.error!=='no-speech')showErr(`오류: ${e.error}`);
  };
  recognition.onend=()=>{ if(isRec)recognition.start(); };
  recognition.start();
}

function stopRec() {
  isRec=false;
  if(recognition){recognition.onend=null;recognition.stop();}
  clearInterval(timerInt);
  document.getElementById('sdot').className='dot';
  document.getElementById('stxt').textContent='녹음 완료';
  document.getElementById('recbtn').textContent='녹음 시작';
  document.getElementById('recbtn').className='btn-rec start';
  if(finalTxt.trim().length>5){
    document.getElementById('aibtn').classList.remove('btn-disabled');
    document.getElementById('meta-form').style.display='block';
    setStep(2);
  }
}

function clearAll() {
  if(isRec)stopRec();
  finalTxt='';generatedMinutes='';parsedData={};secs=0;
  document.getElementById('tarea').innerHTML='<span class="ph">녹음을 시작하면 여기에 실시간으로 텍스트가 표시됩니다.</span>';
  document.getElementById('timer').textContent='00:00';
  document.getElementById('mdur').textContent='0:00';
  document.getElementById('mwords').textContent='0';
  document.getElementById('sdot').className='dot';
  document.getElementById('stxt').textContent='대기 중';
  document.getElementById('aibtn').classList.add('btn-disabled');
  document.getElementById('meta-form').style.display='none';
  document.getElementById('minutes-wrap').style.display='none';
  document.getElementById('notion-wrap').style.display='none';
  document.getElementById('loading').style.display='none';
  document.querySelectorAll('.tag.sel').forEach(t=>t.classList.remove('sel'));
  setStep(1);
}

async function genMinutes() {
  if(!finalTxt.trim()){showErr('녹취 내용이 없습니다.');return;}
  document.getElementById('loading').style.display='block';
  document.getElementById('ldtxt').textContent='AI가 회의록을 작성 중...';
  document.getElementById('minutes-wrap').style.display='none';

  const now=new Date();
  const dateStr=`${now.getFullYear()}년 ${now.getMonth()+1}월 ${now.getDate()}일`;
  const dur=document.getElementById('mdur').textContent;
  const attendees=document.getElementById('inp-attendees').value||'(미입력)';

  const prompt=`다음 회의 녹취록을 분석해 주세요.
일시: ${dateStr}, 녹음 시간: ${dur}, 참석자: ${attendees}

[녹취 내용]
${finalTxt}

아래 JSON 형식으로만 응답해 주세요 (코드블록 없이):
{"주요안건":"주요 안건 요약","논의사항":"논의 내용 정리","결정사항":"결정 사항들","액션아이템":"담당자와 기한 포함 액션 아이템","전체회의록":"■ 회의 개요\\n- 일시: ${dateStr}\\n- 녹음: ${dur}\\n- 참석자: ${attendees}\\n\\n■ 주요 논의\\n내용\\n\\n■ 결정 사항\\n내용\\n\\n■ 액션 아이템\\n내용"}`;

  try {
    const res=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:1000,messages:[{role:'user',content:prompt}]})});
    const data=await res.json();
    const raw=data.content?.map(b=>b.text||'').join('')||'';
    try{parsedData=JSON.parse(raw.replace(/```json|```/g,'').trim());}catch{parsedData={전체회의록:raw};}
    generatedMinutes=parsedData.전체회의록||raw;
    document.getElementById('mcontent').textContent=generatedMinutes;
    document.getElementById('minutes-wrap').style.display='block';
    setStep(2);
  } catch(err) {
    showErr('AI 연결에 실패했습니다. 잠시 후 다시 시도해 주세요.');
  } finally {
    document.getElementById('loading').style.display='none';
  }
}

async function saveToNotion() {
  if(!generatedMinutes){showErr('먼저 회의록을 생성해 주세요.');return;}
  document.getElementById('loading').style.display='block';
  document.getElementById('ldtxt').textContent='노션에 저장 중...';
  document.getElementById('notionbtn').style.display='none';

  const now=new Date();
  const dateStr=`${now.getFullYear()}년 ${now.getMonth()+1}월 ${now.getDate()}일`;
  const title=document.getElementById('inp-title').value||`회의록 ${dateStr}`;
  const attendees=document.getElementById('inp-attendees').value||'';
  const tags=getSelectedTags();
  const dur=document.getElementById('mdur').textContent;
  const todayISO=`${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`;

  const prompt=`다음 회의록을 노션 "회의록 보관함" 데이터베이스(data_source_id: ${DS_ID})에 저장해 주세요.

속성:
- 제목: "${title}"
- 회의 일시: ${todayISO}
- 녹음 시간: "${dur}"
- 참석자: "${attendees}"
- 상태: "초안"
- 주요 안건: "${(parsedData.주요안건||'').slice(0,200).replace(/"/g,"'")}"
- 결정 사항: "${(parsedData.결정사항||'').slice(0,300).replace(/"/g,"'")}"
- 액션 아이템: "${(parsedData.액션아이템||'').slice(0,300).replace(/"/g,"'")}"
- 전체 녹취록: "${finalTxt.slice(0,500).replace(/"/g,"'")}"
- 태그: ${JSON.stringify(tags)}

페이지 본문: ${generatedMinutes}

저장 후 페이지 URL을 알려주세요.`;

  try {
    const res=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:1000,messages:[{role:'user',content:prompt}],mcp_servers:[{type:'url',url:'https://mcp.notion.com/mcp',name:'notion'}]})});
    const data=await res.json();
    const txt=data.content?.map(b=>b.text||'').join('')||'';
    const urlMatch=txt.match(/https:\/\/(?:www\.)?notion\.so\/[^\s\)\]"<]+/);
    const resultEl=document.getElementById('notion-result');
    resultEl.innerHTML=urlMatch
      ? `<strong>${title}</strong><br><a href="${urlMatch[0]}" target="_blank">노션 페이지 열기 →</a>`
      : `<strong>${title}</strong>이 저장되었습니다. 노션 앱에서 확인해 주세요.`;
    document.getElementById('notion-wrap').style.display='block';
    setStep(3);
  } catch(err) {
    showErr('노션 저장에 실패했습니다.');
    document.getElementById('notionbtn').style.display='block';
  } finally {
    document.getElementById('loading').style.display='none';
  }
}

function copyMin(){
  navigator.clipboard?.writeText(generatedMinutes).then(()=>{
    const b=document.querySelector('[onclick="copyMin()"]');
    b.textContent='복사됨!'; setTimeout(()=>b.textContent='복사',2000);
  }).catch(()=>showErr('복사 실패. 텍스트를 직접 선택해 주세요.'));
}
</script>
</body>
</html>
